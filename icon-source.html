<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* PWAアイコンの元。変更したら以下で再生成:
   chrome --headless --window-size=512,512 --hide-scrollbars --screenshot=icon-512.png file://.../icon-source.html
   sips -z 192 192 icon-512.png --out icon-192.png */
*{margin:0}
body{width:512px;height:512px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#1b1428 0%,#241830 55%,#33202c 100%)}
.moon{position:absolute;left:140px;top:130px;width:240px;height:240px;border-radius:50%;
  background:linear-gradient(200deg,#ffe9b3,#f0c274);overflow:hidden;
  box-shadow:0 0 90px 20px rgba(255,220,150,.4)}
.bite{position:absolute;left:74px;top:-58px;width:230px;height:230px;border-radius:50%;
  background:#231732}
.star{position:absolute;background:#fff;border-radius:50%}
.s1{left:110px;top:330px;width:10px;height:10px;opacity:.9;box-shadow:0 0 14px 4px rgba(255,255,255,.6)}
.s2{left:390px;top:150px;width:7px;height:7px;opacity:.75}
.s3{left:340px;top:390px;width:8px;height:8px;opacity:.8;box-shadow:0 0 10px 3px rgba(255,255,255,.4)}
.s4{left:72px;top:150px;width:5px;height:5px;opacity:.6}
</style>
</head>
<body>
<div class="moon"><div class="bite"></div></div>
<div class="star s1"></div>
<div class="star s2"></div>
<div class="star s3"></div>
<div class="star s4"></div>
</body>
</html>
